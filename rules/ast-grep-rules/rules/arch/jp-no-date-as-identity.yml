id: jp-no-date-as-identity
language: TypeScript
severity: warning
message: "禁止用当前时间（毫秒级时间戳）当持久化主键——同一毫秒内写入的多条记录会撞 id"
note: |
  否命题 A7（docs/architecture.md）。

  为什么：时间戳只有毫秒分辨率。批量写入（例如一次划选收集多个词）时，
  相邻两次写入经常落在同一毫秒，于是多行拿到同一个 id；
  之后任何"按 id 更新状态 / 删除"的操作都会同时命中多行，且不会报错——属于静默数据损坏。

  正确做法：主键用 crypto.randomUUID()（或 时间戳 + 单调序号）；
  时间戳只作为普通字段保留。

  ⚠ 规则的匹配范围是「id 语境」：变量名 / 属性名看起来是 id，且值是时间表达式。
  这是刻意的——时间戳当普通字段（timestamp 列）是正常的，本仓库就有；
  要禁的是拿它当主键。改动这条规则的匹配条件时必须同步改
  rules/ast-grep-rules/rule-tests/jp-no-date-as-identity-test.yml，
  否则等于在无人察觉的情况下放宽约束（A14）。

  例：
    ❌  const id = new Date().toISOString()
    ❌  const rowId = Date.now()
    ❌  ({ id: Date.now() })
    ✅  const record = { id: randomUUID(), timestamp: new Date().toISOString() }
rule:
  any:
    - kind: variable_declarator
      all:
        - has:
            field: name
            regex: "(?i)^(id|.+_id|.+Id)$"
        - has:
            field: value
            any:
              - pattern: new Date().toISOString()
              - pattern: Date.now()
              - pattern: Date.now().toString()
    - kind: pair
      all:
        - has:
            field: key
            regex: "(?i)^(id|.+_id|.+Id)$"
        - has:
            field: value
            any:
              - pattern: new Date().toISOString()
              - pattern: Date.now()
              - pattern: Date.now().toString()
